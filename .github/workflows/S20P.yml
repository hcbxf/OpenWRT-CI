#CI项目
name: S20P

#CI计划
on:
  #定时编译：每周二早上5点（北京时间）
  schedule:
    - cron: 0 21 * * 1
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: S20P-WIFI-YES

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: S20P-WIFI-YES
      #完整配置文件，不再叠加GENERAL.txt
      WRT_FULL_CONFIG: true
      #默认主题
      WRT_THEME: vantage
      #默认主机名
      WRT_NAME: OWRT
      #默认WIFI名称
      WRT_SSID: OWRT
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.2.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      #源码分支
      WRT_BRANCH: owrt
      #源码名称
      WRT_SOURCE: VIKINGYFY/immortalwrt
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
      #不发布Release，改为上传Artifact
      WRT_ARTIFACT: true
      #集成WiFi电源控制APP（仅S20P工作流）
      WRT_WIFI_POWER: true
